<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comparación Facial con Porcentajes y Gráficos - Azure</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --container-bg: rgba(30, 27, 75, 0.45);
      --container-border: #4338ca;
      --box-bg: rgba(15, 23, 42, 0.7);
      --box-border: #312e81;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-title: #a5b4fc;
      --btn-bg: #4f46e5;
      --btn-hover: #4338ca;
      --btn-disabled: #374151;
      --status-color: #818cf8;
      --pred-bg: #1e1b4b;
      --pred-border: #3730a3;
      --bar-gradient: linear-gradient(90deg, rgba(99, 102, 241, 0.45), rgba(168, 85, 247, 0.75));
      --bar-top-gradient: linear-gradient(90deg, rgba(129, 140, 248, 0.7), rgba(192, 132, 252, 0.95));
      --match-bg: rgba(6, 78, 59, 0.7);
      --match-border: #10b981;
      --match-text: #a7f3d0;
      --nomatch-bg: rgba(127, 29, 29, 0.7);
      --nomatch-border: #f43f5e;
      --nomatch-text: #fecdd3;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: var(--container-bg);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 860px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--container-border);
    }
    h2 { margin-top: 0; color: var(--accent-title); font-size: 1.4rem; }
    p { color: var(--text-muted); font-size: 0.9rem; }
    .comparison-grid {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin-top: 20px;
    }
    .photo-box {
      flex: 1;
      background: var(--box-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed var(--box-border);
    }
    .photo-box h4 { margin: 0 0 10px 0; color: #e0e7ff; }
    input[type="file"] { width: 100%; color: var(--text-muted); font-size: 0.85rem; }
    .image-container {
      position: relative;
      display: inline-block;
      margin-top: 10px;
    }
    img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .predictions-list {
      margin-top: 12px;
      text-align: left;
      font-size: 0.85rem;
    }
    .pred-item {
      position: relative;
      background: var(--pred-bg);
      border-radius: 6px;
      margin-bottom: 6px;
      overflow: hidden;
      border: 1px solid var(--pred-border);
    }
    .pred-content {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding: 7px 12px;
      color: #cbd5e1;
      font-size: 0.85rem;
    }
    .pred-item.top {
      border-left: 4px solid #c084fc;
    }
    .pred-item.top .pred-content {
      color: #ffffff;
      font-weight: bold;
    }
    .progress-bar-bg {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--bar-gradient);
      z-index: 1;
      transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pred-item.top .progress-bar-bg {
      background: var(--bar-top-gradient);
    }
    .action-btn {
      margin-top: 25px;
      padding: 12px 32px;
      background: var(--btn-bg);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }
    .action-btn:hover:not(:disabled) {
      background: var(--btn-hover);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
    }
    .action-btn:disabled {
      background: var(--btn-disabled);
      color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status { margin-top: 15px; font-weight: 500; font-size: 1rem; color: var(--status-color); }
    .verdict-card {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      display: none;
    }
    .match {
      background: var(--match-bg);
      color: var(--match-text);
      border: 1px solid var(--match-border);
    }
    .no-match {
      background: var(--nomatch-bg);
      color: var(--nomatch-text);
      border: 1px solid var(--nomatch-border);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Comparación Biométrica Facial (1:1 Verification)</h2>
    <p>Carga dos rostros para verificar si pertenecen a la misma identidad y comparar sus probabilidades</p>

    <div class="comparison-grid">
      <!-- Rostro A -->
      <div class="photo-box">
        <input type="file" id="inputA" accept="image/*">
        <div class="image-container">
          <img id="imgA" alt="Rostro A">
          <canvas id="canvasA"></canvas>
        </div>
        <div id="predsA" class="predictions-list"></div>
      </div>

      <!-- Rostro B -->
      <div class="photo-box">
        <input type="file" id="inputB" accept="image/*">
        <div class="image-container">
          <img id="imgB" alt="Rostro B">
          <canvas id="canvasB"></canvas>
        </div>
        <div id="predsB" class="predictions-list"></div>
      </div>
    </div>

    <button id="compareBtn" class="action-btn" disabled>Comparar Rostros</button>
    <div id="status" class="status">Carga ambas imágenes para habilitar la comparación.</div>
    <div id="verdict" class="verdict-card"></div>
  </div>

  <script>
    // 1. Azure Face API (Puntos Anatómicos)
    const FACE_ENDPOINT = "https://reconocimiento-facial-senati.cognitiveservices.azure.com/";
    const FACE_KEY = "EZdih6T6yy87Bx4rCjoVWg4OEtoerEV6QVZF1o1RUkGVGbkGdT40JQQJ99CIAC4f1cMXJ3w3AAAKACOG4Slm";

    // 2. Azure Custom Vision (Nueva Clave de Predicción)
    const CV_ENDPOINT = "https://customvisionfacial-prediction.cognitiveservices.azure.com/customvision/v3.0/Prediction/d0589c94-1190-41dc-876e-0c938667ece9/classify/iterations/RECONOCIMIENTO%20FACIAL/image";
    const CV_KEY = "2CRb1j4d61trTH87o2GzkOCL22SeteyfeScLJLpLKEUokyZuMKrmJQQJ99CIACHrzpqXJ3w3AAAIACOGy9dH";
    let fileA = null;
    let fileB = null;

    const inputA = document.getElementById('inputA');
    const inputB = document.getElementById('inputB');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');
    const canvasA = document.getElementById('canvasA');
    const canvasB = document.getElementById('canvasB');
    const predsDivA = document.getElementById('predsA');
    const predsDivB = document.getElementById('predsB');
    const compareBtn = document.getElementById('compareBtn');
    const statusDiv = document.getElementById('status');
    const verdictDiv = document.getElementById('verdict');

    // Redimensiona y comprime la imagen a menos de 1 MB para que Custom Vision no arroje error 400
    function compressImage(file, maxSize = 1000) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxSize || height > maxSize) {
              if (width > height) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              } else {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              resolve(blob || file);
            }, 'image/jpeg', 0.85);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Dibuja los landmarks de Azure Face con tono violeta suave
    async function extractLandmarks(blob, imgElem, canvasElem) {
      imgElem.src = URL.createObjectURL(blob);
      imgElem.style.display = "block";

      await new Promise(r => imgElem.onload = r);

      canvasElem.width = imgElem.clientWidth;
      canvasElem.height = imgElem.clientHeight;
      const ctx = canvasElem.getContext('2d');
      ctx.clearRect(0, 0, canvasElem.width, canvasElem.height);

      const faceUrl = `${FACE_ENDPOINT.replace(/\/$/, '')}/face/v1.0/detect?returnFaceLandmarks=true&recognitionModel=recognition_04&detectionModel=detection_01`;

      try {
        const res = await fetch(faceUrl, {
          method: "POST",
          headers: {
            "Ocp-Apim-Subscription-Key": FACE_KEY,
            "Content-Type": "application/octet-stream"
          },
          body: blob
        });
        const data = await res.json();

        if (data && data.length > 0 && data[0].faceLandmarks) {
          const scaleX = imgElem.clientWidth / imgElem.naturalWidth;
          const scaleY = imgElem.clientHeight / imgElem.naturalHeight;
          const lm = data[0].faceLandmarks;

          const points = [lm.pupilLeft, lm.pupilRight, lm.noseTip, lm.mouthLeft, lm.mouthRight, lm.underLipBottom];
          points.forEach(pt => {
            if (pt) {
              ctx.beginPath();
              ctx.arc(pt.x * scaleX, pt.y * scaleY, 4, 0, 2 * Math.PI);
              ctx.fillStyle = '#a855f7';
              ctx.fill();
              ctx.strokeStyle = '#e0e7ff';
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }
          });
        }
      } catch (err) {
        console.warn("Error obteniendo landmarks:", err);
      }
    }

    // Consulta Custom Vision
    async function classifyFace(blob) {
      const res = await fetch(CV_ENDPOINT, {
        method: "POST",
        headers: {
          "Prediction-Key": CV_KEY,
          "Content-Type": "application/octet-stream"
        },
        body: blob
      });
      return await res.json();
    }

    // Renderiza la lista con barras gráficas de progreso
    function renderPredictions(predictions, container) {
      container.innerHTML = "";
      if (!predictions || predictions.length === 0) return;

      predictions.forEach((p, index) => {
        const pct = (p.probability * 100).toFixed(1);
        const div = document.createElement('div');
        div.className = `pred-item ${index === 0 ? 'top' : ''}`;
        div.innerHTML = `
          <div class="progress-bar-bg" style="width: ${pct}%"></div>
          <div class="pred-content">
            <span>${p.tagName}</span>
            <span>${pct}%</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    inputA.addEventListener('change', async (e) => {
      const raw = e.target.files[0];
      if (!raw) return;
      verdictDiv.style.display = "none";
      predsDivA.innerHTML = "";
      statusDiv.textContent = "Procesando Imagen A...";
      fileA = await compressImage(raw);
      await extractLandmarks(fileA, imgA, canvasA);
      checkReady();
    });

    inputB.addEventListener('change', async (e) => {
      const raw = e.target.files[0];
      if (!raw) return;
      verdictDiv.style.display = "none";
      predsDivB.innerHTML = "";
      statusDiv.textContent = "Procesando Imagen B...";
      fileB = await compressImage(raw);
      await extractLandmarks(fileB, imgB, canvasB);
      checkReady();
    });

    function checkReady() {
      if (fileA && fileB) {
        compareBtn.disabled = false;
        statusDiv.textContent = "Ambas fotos procesadas.";
      } else {
        compareBtn.disabled = true;
      }
    }

    compareBtn.addEventListener('click', async () => {
      compareBtn.disabled = true;
      statusDiv.textContent = "Consultando clasificaciones en Azure...";

      try {
        const [dataA, dataB] = await Promise.all([
          classifyFace(fileA),
          classifyFace(fileB)
        ]);

        if (dataA.predictions && dataB.predictions) {
          renderPredictions(dataA.predictions, predsDivA);
          renderPredictions(dataB.predictions, predsDivB);

          const predA = dataA.predictions[0];
          const predB = dataB.predictions[0];

          verdictDiv.style.display = "block";

          const nameA = predA.tagName.split('_')[0];
          const nameB = predB.tagName.split('_')[0];
          const isSame = nameA.toLowerCase() === nameB.toLowerCase();

          if (isSame) {
            const avgMatch = (((predA.probability + predB.probability) / 2) * 100).toFixed(1);
            verdictDiv.className = "verdict-card match";
            verdictDiv.innerHTML = `COINCIDENCIA CONFIRMADA: Misma Persona (${nameA})<br><span style="font-size:0.9rem">Certeza promedio: ${avgMatch}%</span>`;
          } else {
            verdictDiv.className = "verdict-card no-match";
            verdictDiv.innerHTML = `ACCESO DENEGADO: Personas Distintas (${nameA} vs ${nameB})`;
          }
          statusDiv.textContent = "Comparación completada con éxito.";
        } else {
          const errMsg = dataA.message || dataB.message || "No se pudieron obtener las predicciones de Azure.";
          statusDiv.textContent = errMsg;
        }
      } catch (err) {
        console.error(err);
        statusDiv.textContent = "Error al conectar con la API de Azure.";
      } finally {
        compareBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
